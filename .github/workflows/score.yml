name: Scoring code quality

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  score-code:
    runs-on: ${{ matrix.os }}-latest
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        shell: bash -l {0}
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        os: ["ubuntu"]
    continue-on-error: true

    steps:

    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pylint

    - name: Check code quality
      id: linting
      run: |
        pylint -ry src/ main.py scripts/ ||:

    - name: Check for reproducibility
      run: |
        python main.py
